name: Deploy Hyderabad Links API to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      # A migration that nothing else touches still has to reach the database, and this workflow is
      # the only thing that applies one. The redeploy it also triggers ships identical code.
      - 'database/sqlserver/**'
      - '.github/workflows/main_hyderabad-links-api.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one that may be part way through a migration.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore backend/BusinessDirectory.Api/BusinessDirectory.Api.csproj

      - name: Build API
        run: dotnet build backend/BusinessDirectory.Api/BusinessDirectory.Api.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish backend/BusinessDirectory.Api/BusinessDirectory.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload published API
        uses: actions/upload-artifact@v4
        with:
          name: hyderabad-links-api
          path: ./publish/

  # Applies database/sqlserver/migrations and the reference seeds before the new code ships.
  #
  # Schema first is the safe order. The migrations are forward-only and additive, so the running
  # (old) code is unaffected by a schema that has moved ahead of it, while new code against an old
  # schema is not. It runs after `build` so a deployment that cannot even compile never reaches the
  # database.
  #
  # It is OFF until the owner switches it on, so adding it changes nothing about today's deploy:
  #   1. Create a `production-database` environment and add required reviewers to it, which is what
  #      makes this the gated step `docs/deployment.md` asks for.
  #   2. Add the secret DATABASE_CONNECTION_STRING to that environment. It needs rights to create
  #      and alter this project's objects, which the API's own login does not need and should not
  #      have.
  #   3. Set the repository variable RUN_MIGRATIONS to `true`.
  # Until then S0009-S0017's successors keep being applied by hand, which is what this closes.
  #
  # Unverified from here: the database is on shared hosting rather than Azure SQL, so it may only
  # accept connections from allow-listed addresses, and a GitHub-hosted runner's address is not
  # fixed. If that is how it is configured, this needs a self-hosted runner or an allow-list entry,
  # and `npm run db:migrate` from a trusted machine stays the fallback.
  migrate:
    if: vars.RUN_MIGRATIONS == 'true'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment: production-database

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Said plainly here rather than left to surface as a connection error further down.
      - name: Check the connection string is configured
        env:
          CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: |
          if [ -z "$CONNECTION_STRING" ]; then
            echo "::error::DATABASE_CONNECTION_STRING is not set on the production-database environment."
            exit 1
          fi

      # What it is about to do, before it does it. This half is read-only — it reads the journal and
      # nothing else — and it names the server and database, so the job log is a record of what ran
      # and where.
      #
      # It also decides whether this job may apply anything at all.
      #
      # Applying the schema before the code is the right order only while a migration is
      # **additive**: old code tolerates a schema that has moved ahead of it, so the window between
      # the two is harmless. A migration that changes or removes something the running build reads
      # inverts that, and `S0029` is the first one in this project to do so — it turns
      # `listing_entitlements.link_limit` from a number into NULL, which the previous API build
      # reads with `GetInt32` and throws on. Applied in this slot, it would break the owner's links
      # screen for as long as the deployment that follows it takes.
      #
      # Rather than reorder the jobs — which would give up the guarantee that a failed additive
      # migration stops the deployment — this job declines to apply a non-additive migration and
      # says so. Those are applied by hand, after the API is deployed and verified, which is the
      # order `docs/deployment.md` sets out and the same convention `database/sqlserver/manual/`
      # already follows for `S0027`.
      #
      # "Non-additive" is read from the `approved-destructive:` marker the script carries. That
      # marker is not decoration: `scripts/check-migrations.mjs` requires it on any migration with a
      # destructive statement in it, so a script that needs this treatment cannot reach main without
      # the thing this step looks for.
      - name: List what would be applied, and check it is additive
        id: pending
        env:
          ConnectionStrings__Default: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: |
          set -euo pipefail

          dotnet run --project backend/BusinessDirectory.Api --no-launch-profile -- migrate --what-if | tee what-if.log

          # The pending list only. The seeds section below it lists .sql files too, and is re-applied
          # on every run by design, so reading past "Reference seeds" would flag those as pending.
          sed -n '/migration(s) would be applied:/,/Reference seeds/p' what-if.log | grep -oE 'S[0-9]{4}__[A-Za-z0-9_]+\.sql' > pending.txt || true

          destructive=""
          while read -r script; do
            [ -n "$script" ] || continue
            file="database/sqlserver/migrations/$script"
            if [ -f "$file" ] && grep -q 'approved-destructive' "$file"; then
              destructive="$destructive $script"
            fi
          done < pending.txt

          if [ -n "$destructive" ]; then
            echo "additive=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Migration not applied automatically::Pending non-additive migration(s):$destructive — apply by hand after the API deployment is verified."
          else
            echo "additive=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply migrations and reference seeds
        if: steps.pending.outputs.additive == 'true'
        env:
          ConnectionStrings__Default: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: dotnet run --project backend/BusinessDirectory.Api --no-launch-profile -- migrate

      # Succeeds deliberately. A failure here would stop `deploy`, and deploying the new API is
      # exactly what has to happen first in this case. Nothing was written to the database — not the
      # migration and not the reference seeds, which this job would otherwise re-apply.
      - name: Explain why nothing was applied
        if: steps.pending.outputs.additive != 'true'
        run: |
          echo "A pending migration is marked approved-destructive, so this job applied nothing."
          echo
          echo "The deployment continues: the new API ships first, by design."
          echo "Apply the migration by hand once it is verified, from a trusted machine:"
          echo
          echo "  npm run db:migrate -- --what-if   # read this before the next line"
          echo "  npm run db:migrate"
          echo
          echo "See docs/deployment.md for the order and the rollback path."

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]
    # `migrate` is skipped while RUN_MIGRATIONS is unset, and a skipped job would otherwise skip
    # this one with it. A *failed* migration must still stop the deployment: shipping code whose
    # schema was not applied is the thing this ordering exists to prevent.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download published API
        uses: actions/download-artifact@v4
        with:
          name: hyderabad-links-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E5D5718FBAD04E05BE4F036C996994CB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_22F6CA0500A747D79984603235D990D9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_61D6EDB0EE93466D95B128837A44F1E8 }}

      - name: Deploy API to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: hyderabad-links-api
          slot-name: Production
          package: ./publish
